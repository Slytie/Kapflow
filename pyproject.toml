[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onetruth-runtime"
version = "0.1.0"
description = "Stage 4 runtime scaffold for the one-truth orchestration substrate."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4.0"]
api = ["uvicorn>=0.30,<1.0"]

[project.scripts]
onetruthctl = "onetruth.cli.__main__:main"
onetruth-api = "onetruth.api.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
