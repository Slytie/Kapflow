scenario_id: stage07_lease_expiry_recovery
workflow_id: schedule_planning.v1
workflow_version: v1
scope:
  tenant_id: tenant-a
  domain_id: domain-x
partition_key: SD-2026-03-13
logical_date: "2026-03-13"
steps:
  - id: create_flag
    action: flags.create
    payload:
      workflow_run_id: "{{workflow_run_id}}"
      kind: weather_disruption
      severity: high
      summary: "Sudden weather disruption in north zone"
      details_json:
        reason_code: weather_disruption
      created_by:
        id: human:dispatcher-5
        type: human
      idempotency_key: "scenario:{{scenario_id}}:flags.create:weather"
    save_as: create_flag
  - id: activate_issue
    action: stage07.activate-issue
    payload:
      workflow_run_id: "{{workflow_run_id}}"
      flag_id: "{{create_flag.flag.flag_id}}"
      generation: 0
      idempotency_key: "scenario:{{scenario_id}}:stage07.activate-issue:weather"
    save_as: activate_issue
  - id: claim_issue
    action: tasks.claim
    payload:
      human_task_id: "{{activate_issue.result.human_task.human_task_id}}"
      actor_id: human:ops-manager-5
      actor_type: human
      lease_seconds: 60
      idempotency_key: "scenario:{{scenario_id}}:tasks.claim:root"
    save_as: claim_issue
  - id: sweep_leases
    action: maintenance.sweep-leases
    payload:
      workflow_run_id: "{{workflow_run_id}}"
      now: "2099-01-01T00:00:00Z"
    save_as: sweep_leases
expected_events:
  ordered_contains:
    - workflow.run.created
    - flag.created
    - task.run.created
    - task.created
    - task.claimed
    - task.lease_expired
    - task.run.state_changed
expected_flag_states:
  - kind: weather_disruption
    state: open
expected_task_states:
  - stage_id: Stage07
    task_kind: exception_triage
    state: OPEN
expected_spawned_children: []
expected_pointer_targets: []
expected_query_rows:
  task_rows: 1
  open_tasks: 1
  approval_rows: 0
  pointer_rows: 0
  flag_rows: 1
