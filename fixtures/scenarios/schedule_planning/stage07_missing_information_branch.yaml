scenario_id: stage07_missing_information_branch
workflow_id: schedule_planning.v1
workflow_version: v1
scope:
  tenant_id: tenant-a
  domain_id: domain-x
partition_key: SD-2026-03-10
logical_date: "2026-03-10"
seed_artifacts:
  - artifact_kind: schedule.exception_board.doc
    artifact_role: evidence
    media_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
    source_path: Stage07_Intraday_Exception_Control/Stage07_Intraday_Exception_Control_Document_Example_COMPLETED.docx
steps:
  - id: create_flag
    action: flags.create
    payload:
      workflow_run_id: "{{workflow_run_id}}"
      kind: vehicle_issue
      severity: medium
      summary: "Vehicle V-42 became unavailable"
      details_json:
        reason_code: vehicle_issue
      created_by:
        id: human:dispatcher-2
        type: human
      idempotency_key: "scenario:{{scenario_id}}:flags.create:vehicle"
    save_as: create_flag
  - id: activate_issue
    action: stage07.activate-issue
    payload:
      workflow_run_id: "{{workflow_run_id}}"
      flag_id: "{{create_flag.flag.flag_id}}"
      generation: 0
      idempotency_key: "scenario:{{scenario_id}}:stage07.activate-issue:vehicle"
    save_as: activate_issue
  - id: claim_issue
    action: tasks.claim
    payload:
      human_task_id: "{{activate_issue.result.human_task.human_task_id}}"
      actor_id: human:ops-manager-2
      actor_type: human
      actor_roles: [operations_manager]
      lease_seconds: 300
      idempotency_key: "scenario:{{scenario_id}}:tasks.claim:root"
    save_as: claim_issue
  - id: upload_exception_board
    action: artifacts.ingest
    payload:
      workflow_run_id: "{{workflow_run_id}}"
      task_run_id: "{{activate_issue.result.task_run.task_run_id}}"
      artifact_kind: schedule.exception_board.doc
      artifact_role: evidence
      media_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
      source_path: Stage07_Intraday_Exception_Control/Stage07_Intraday_Exception_Control_Document_Template_EMPTY.docx
      file_name: Stage07_Intraday_Exception_Control_Document_Template_EMPTY.docx
      links:
        - subject_kind: human_task
          subject_id: "{{activate_issue.result.human_task.human_task_id}}"
          relation_kind: attachment
      metadata_json:
        branch: stage07_missing_information_branch
      idempotency_key: "scenario:{{scenario_id}}:artifacts.ingest:exception-board-upload"
    save_as: upload_exception_board
  - id: complete_issue
    action: tasks.complete
    payload:
      human_task_id: "{{activate_issue.result.human_task.human_task_id}}"
      actor_id: human:ops-manager-2
      actor_type: human
      outcome: replan_requires_missing_information
      idempotency_key: "scenario:{{scenario_id}}:tasks.complete:root"
    save_as: complete_issue
expected_events:
  ordered_contains:
    - workflow.run.created
    - flag.created
    - task.run.created
    - task.created
    - task.claimed
    - task.completed
    - task.run.created
    - task.created
expected_flag_states:
  - kind: vehicle_issue
    state: open
expected_task_states:
  - stage_id: Stage07
    task_kind: exception_triage
    state: COMPLETED
  - stage_id: Stage07
    task_kind: information_request
    state: OPEN
expected_spawned_children:
  - parent_outcome: replan_requires_missing_information
    stage_id: Stage07
    task_kind: information_request
    spawn_rule_id: stage07_request_issue_information
expected_pointer_targets: []
expected_query_rows:
  task_rows: 2
  open_tasks: 1
  approval_rows: 0
  pointer_rows: 0
  flag_rows: 1
