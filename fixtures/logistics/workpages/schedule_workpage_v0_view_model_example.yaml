          - Brahmvir Singh
          - Sachin Goyal
      - key: scenario_added_routes
        label: Scenario added routes
        input: integer
        value: 0
      - key: scenario_dropped_routes
        label: Scenario dropped routes
        input: integer
        value: 0
      - key: scenario_note
        label: Planner note
        input: textarea
        value: ''
