notes:
- Only the daily route totals came from Schedule March 22 to March 28.pdf; staffing cells,
  staffing patterns, and richer route-shape details remain out of scope for this package.
- This package carries range-aware On-Call buffer guidance of min 3 / preferred 4 / max 5
  legal reserve positions per day after route coverage, without inflating route counts.
- This package also carries range-aware excess-capacity guidance of min 2 / preferred 3 /
  max 5 legal scheduled shifts per day after route coverage and On-Call filling, without
  inflating route counts.
- Compatibility-package target/cap values remain visible for review, but this pilot treats
  weekly target shifts and rolling 7 / weekly cap defaults as heuristic planner guidance
  rather than silent hard blockers.
- All non-route-total pilot inputs are intentionally unchanged from weekly_stage04_actual_ops_lab_v1.
- The operational service week is Sunday through Saturday, while the repo PlanningWeekID
  remains ISO Monday through Sunday; this package keeps both values explicit for review.
- Raw requests were treated as unavailability only for this pilot package; a strict-truth
  pipeline would require approval state.
- Previous-week actuals are proxy values inferred from state labels, not payroll-grade
  closeout minutes.
