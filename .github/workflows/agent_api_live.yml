name: agent_api_live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-live-integration:
    name: openai-live-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run baseline checks (non-network)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            make PYTHON=python ci-fast-backend
          else
            echo "No Makefile found; skipping make-based checks."
          fi

      - name: Verify live OpenAI secret is configured
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not set in repository secrets."
            echo "agent_api_live is manual-only and expects an explicit live secret."
            exit 1
          fi

      - name: Run OpenAI integration tests (manual + gated)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E: ${{ vars.ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E }}
        run: |
          set -euo pipefail
          if [ "${ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E:-0}" != "1" ]; then
            echo "ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E is not 1. Weekly Stage04 real-network e2e remains skipped."
          fi

          if [ -d tests/integration_openai ]; then
            ONETRUTH_RUN_OPENAI_E2E=1 ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E="${ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E:-0}" PYTHONPATH=src pytest -q tests/integration_openai
            exit 0
          fi

          echo "No tests/integration_openai directory found. Skipping OpenAI integration tests."
          exit 0
