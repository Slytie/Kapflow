name: agent_api

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  openai-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]"
          else
            echo "No requirements.txt or pyproject.toml found; skipping project install."
          fi

      - name: Run baseline checks (non-network)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            make PYTHON=python ci-backend
          else
            echo "No Makefile found; skipping make-based checks."
          fi

      - name: Run OpenAI integration tests (gated + weekly dual gate)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E: ${{ vars.ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is not set in repository secrets. Skipping OpenAI integration tests."
            exit 0
          fi

          if [ "${ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E:-0}" != "1" ]; then
            echo "ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E is not 1. Weekly Stage04 real-network e2e remains skipped."
          fi

          if [ -d tests/integration_openai ]; then
            ONETRUTH_RUN_OPENAI_E2E=1 ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E="${ONETRUTH_RUN_OPENAI_WEEKLY_AGENT_E2E:-0}" PYTHONPATH=src pytest -q tests/integration_openai
            exit 0
          fi

          echo "No tests/integration_openai directory found. Skipping OpenAI integration tests."
          exit 0
