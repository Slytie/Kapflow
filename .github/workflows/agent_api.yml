name: agent_api

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  mock-openai-baseline:
    name: mock-openai-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run baseline checks (mock / non-network)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            make PYTHON=python ci-fast-backend
          else
            echo "No Makefile found; skipping make-based checks."
          fi

      - name: Confirm live OpenAI coverage lives in agent_api_live
        shell: bash
        run: |
          set -euo pipefail
          echo "Scheduled and routine manual coverage stays mock-only in agent_api."
          echo "Use agent_api_live for gated real OpenAI integration runs."
