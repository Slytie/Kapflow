name: agent_api

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  openai-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          else
            echo "No requirements.txt or pyproject.toml found; skipping project install."
          fi
          python -m pip install pytest pyyaml jsonschema requests

      - name: Run baseline checks (non-network)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            make ci-backend
          fi
          pytest -q

      - name: Run OpenAI integration tests (gated)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is not set in repository secrets. Skipping OpenAI integration tests."
            exit 0
          fi

          if [ -d tests/integration_openai ]; then
            ONETRUTH_RUN_OPENAI_E2E=1 PYTHONPATH=src pytest -q tests/integration_openai
            exit 0
          fi

          echo "No tests/integration_openai directory found. Skipping OpenAI integration tests."
          exit 0
