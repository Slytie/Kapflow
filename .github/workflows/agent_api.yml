name: agent_api

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  mock-openai-baseline:
    name: mock-openai-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run baseline checks (mock / non-network)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            make PYTHON=python ci-fast-backend
          else
            echo "No Makefile found; skipping make-based checks."
          fi

      - name: Confirm live OpenAI coverage lives in agent_api_live
        shell: bash
        run: |
          set -euo pipefail
          echo "Scheduled and routine manual coverage stays mock-only in agent_api."
          echo "Use agent_api_live for gated real OpenAI integration runs."
