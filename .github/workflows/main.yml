name: main

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-fast:
    name: required-fast / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            make_target: backend-lint
          - check: contract
            make_target: contract
          - check: unit
            make_target: unit
          - check: workpage-mutation-smoke
            make_target: workpage-mutation-smoke
          - check: security
            make_target: security
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run fast required backend check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Makefile ]; then
            make PYTHON=python ${{ matrix.make_target }}
          else
            echo "No Makefile found; skipping make-based checks."
          fi

  runtime-required:
    name: runtime-required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run runtime-required CI lane
        shell: bash
        run: |
          set -euo pipefail
          make PYTHON=python ci-runtime-required

  frontend-workpages-smoke:
    name: frontend / workpages-smoke
    if: ${{ hashFiles('frontend/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend workpage smoke checks
        run: make frontend-workpages-smoke

  frontend:
    name: frontend
    if: ${{ hashFiles('frontend/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend CI checks
        run: make frontend-ci

  release-confidence:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: release-confidence / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: validation
            make_target: release-confidence-validation
          - check: demo-export
            make_target: release-confidence-demo-export
          - check: projection-coherence
            make_target: release-confidence-projection-coherence
          - check: logistics-handoff
            make_target: release-confidence-logistics-weekly-live
          - check: certification-manifest
            make_target: release-confidence-certification-manifest
    env:
      RELEASE_CONFIDENCE_DB_PATH: ${{ runner.temp }}/release-confidence-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}.db
      RELEASE_CONFIDENCE_DB_URL: sqlite:///${{ runner.temp }}/release-confidence-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}.db
      RELEASE_CONFIDENCE_OUTPUT_ROOT: ${{ runner.temp }}/release-confidence/${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_CONFIDENCE_KEY: ci-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_CONFIDENCE_OPENAI_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run release-confidence gate slice
        shell: bash
        run: |
          set -euo pipefail
          make PYTHON=python ${{ matrix.make_target }}
