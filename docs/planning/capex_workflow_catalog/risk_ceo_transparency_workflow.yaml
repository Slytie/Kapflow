schema_version: capex.workflow_catalog.proposal.v1
proposal_id: capex.risk_ceo_transparency.workflow.v1
title: CAPEX Risk and CEO Transparency workflow
activation_posture: planning_only_no_capex_activation
catalog_surface: planning_only_capex_workflow_catalog
source_task_ref: TASK-0290
source_row: WFLOW-008
acceptance_gates:
  - AT-BRIDGE-008
  - NU-010
depends_on:
  repo_tasks:
    - TASK-0277
    - TASK-0289
workflow_basis:
  project_state_snapshot_workflow_schema_version: capex.project_state_snapshot.workflow_outputs.v1
  required_basis_refs:
    - project_state_snapshot_workflow_id
    - project_state_snapshot_digest
    - project_closure_vector_digest
  sanitized_risk_observations_required: true
canonical_outputs:
  - risk_state_snapshot
  - ceo_transparency_snapshot
  - risk_ceo_flags
risk_state_snapshot:
  schema_version: capex.risk_state_snapshot.v1
  official_truth: false
  duplicate_risk_ids_allowed: false
  source_refs_must_be_in_project_state_snapshot: true
  project_state_component_refs_must_be_known: true
ceo_transparency_snapshot:
  schema_version: capex.ceo_transparency_snapshot.v1
  artifact_kind: capex.ceo_transparency_snapshot
  file_name: capex.ceo_transparency_snapshot.v1.json
  forecastability_grades:
    - forecastable
    - bounded_uncertainty
    - not_forecastable
  drilldown_refs_required: true
  raw_ai_text_allowed: false
  false_precision_allowed_when_not_forecastable: false
risk_ceo_flags:
  schema_version: capex.risk_ceo_flags.v1
  stale_pointer_flag_required: true
  missing_evidence_flag_required: true
  evidence_conflict_flag_required: true
  ai_draft_cannot_forecast_flag_required: true
  waiver_caveat_required: true
forecastability_policy:
  missing_evidence_maps_to: not_forecastable
  conflict_maps_to: not_forecastable
  stale_pointer_maps_to: not_forecastable
  ai_draft_only_maps_to: not_forecastable
  waiver_maps_to: bounded_uncertainty
  deterministic_severity_mapping: true
  exact_date_cost_percent_without_forecastability_allowed: false
officialness_policy:
  risk_state_snapshot_is_official_truth: false
  ceo_snapshot_is_official_project_truth: false
  ai_draft_resolves_risk: false
  external_status_sets_official_state: false
  waiver_silently_closes_risk: false
  missing_evidence_allows_forecast: false
  conflict_allows_forecast: false
  reviewed_metadata_is_pointer_truth: false
truth_effects:
  creates_workflow_run: false
  creates_tasks: false
  creates_approvals: false
  creates_risk_engine_state: false
  creates_ceo_cockpit_state: false
  creates_closure_snapshots: false
  creates_official_project_state: false
  writes_artifacts: false
  promotes_official_pointers: false
  activates_workflow_pack: false
not_implemented_in_this_task:
  - authored_workflow_pack
  - runtime_risk_engine
  - ceo_cockpit
  - public_api_route
  - frontend_route
  - workpage_route
  - migration
  - event_registry_change
  - closure_snapshot_creation
  - official_pointer_creation
  - external_system_activation
  - RiskSignal_runtime_contract
  - W8_ceo_transparency_freshness_contract
raw_data_boundary:
  allowed_repo_material:
    - project_state_snapshot_refs
    - sanitized_risk_ids
    - sanitized_risk_labels
    - source_refs
    - input_digests
    - forecastability_grades
    - severity_labels
    - risk_status_labels
    - aggregate_counts
    - canonical_output_shapes
  prohibited_repo_material:
    - full_project_corpus_files
    - unrestricted_source_excerpts
    - raw_ai_output
    - raw_project_filenames
    - absolute_local_paths
    - raw_project_state_text
    - raw_risk_text
    - screenshots_or_logs_with_source_content
    - uploaded_blob_bytes
cannot_be_used_for:
  - capex_runtime_activation
  - product_activation
  - public_route_activation
  - frontend_route_activation
  - ceo_cockpit_activation
  - runtime_risk_engine_activation
  - authored_workflow_pack_activation
  - raw_corpus_import
  - reviewed_baseline_creation
  - closure_snapshot_creation
  - official_project_state
  - official_pointer_creation
  - production_preflight_approval
remaining_open_after_this_task:
  - TASK-0539
  - TASK-0540
