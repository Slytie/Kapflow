  - family_id: migration_lane_evidence
    status: parity_evidence_recorded_blocking_production_lane
    blocking: true
    evidence_refs:
      - alembic/
      - tests/integration/test_migration_bootstrap_parity.py
      - tests/integration/test_capex_project_schema_parity.py
      - tests/integration/test_capex_project_authorization_schema_parity.py
