  - family_id: activation_gate_manifest
    status: disabled_domain_manifest_recorded
    blocking: true
    evidence_refs:
      - docs/domains/capex/domain.yaml
      - docs/architecture/CAPEX_PROJECT_AUTHORIZATION_CED.md
      - docs/planning/capex_three_project_validation/FIXTURE_TIER_CI_POLICY.yaml
