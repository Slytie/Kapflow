  - family_id: release_approval_waiver_trail
    status: no_approved_waiver_or_release_signoff
    blocking: true
    evidence_refs:
      - docs/planning/capex_production_preflight/MASTER_Production_Preflight_Review.md
      - docs/planning/epics/EPIC-152.md
    blocked_reason: No release signoff, activation signoff, or explicit waiver evidence is recorded for PROD-PRE-G08.
missing_evidence:
  - capex_release_candidate_review_record
  - production_migration_lane_rehearsal
  - activation_approval_record
  - feature_gate_pass_record
  - capex_rollback_compensation_rehearsal
  - explicit_gate_waiver_evidence
rollup:
  reviewed_family_count: 5
  blocking_family_count: 5
  result_reason: Release, migration, activation, and rollback evidence review is complete, but PROD-PRE-G08 remains no-go pending production-facing review, rehearsal, approval, and waiver evidence.
raw_data_boundary:
  allowed_repo_material:
    - task ids
    - gate ids
    - sanitized evidence references
    - release evidence category labels
    - migration lane status labels
    - activation posture labels
    - waiver field requirements
  prohibited_repo_material:
    - full project corpus files
    - unrestricted source excerpts
    - raw project filenames
    - screenshots or logs containing source content
    - mounted raw corpus paths
    - project-specific hardcoded logic
cannot_be_used_for:
  - capex_runtime_activation
  - product_activation
  - public_route_activation
  - workflow_pack_activation
  - raw_corpus_import
  - fixture_release_approval
  - waiver_approval
  - release_approval
  - migration_approval
  - activation_approval
  - rollback_rehearsal_completion_claim
  - compensation_rehearsal_completion_claim
  - production_preflight_approval
  - pilot_readiness_approval
  - final_go_no_go_approval
