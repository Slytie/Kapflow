fixture_cases:
  - fixture_case_id: K12-T1
    situation: Scope 1 closed, Scope 2 closed, Scope 3 budget build-up
    expected_behavior: Show scope statuses separately and prevent false overall closure.
    target_epics: [EPIC-140, EPIC-143, EPIC-147]
  - fixture_case_id: K12-T2
    situation: Handover completed with residual items open
    expected_behavior: Show handover while project closure remains open or restricted.
    target_epics: [EPIC-142, EPIC-147]
  - fixture_case_id: K12-T3
    situation: Supplier says defect fixed; operation has not confirmed effectiveness
    expected_behavior: Keep defect in observation phase or effectiveness-open state.
    target_epics: [EPIC-142, EPIC-147]
  - fixture_case_id: K12-T4
    situation: PR/PO exists and invoice or controlling figure deviates
    expected_behavior: Show commercial deviation and create clarification work.
    target_epics: [EPIC-151, EPIC-144, EPIC-147]
  - fixture_case_id: K12-T5
    situation: Quotation contains assumptions or exclusions
    expected_behavior: Extract assumptions but require SME review before project-state adoption.
    target_epics: [EPIC-142, EPIC-147]
  - fixture_case_id: K12-T6
    situation: New revision makes old evaluation uncertain
    expected_behavior: Mark affected evidence and decisions as requiring review.
    target_epics: [EPIC-141, EPIC-142, EPIC-147]
  - fixture_case_id: K12-T7
    situation: Executive cockpit aggregates status with open assumptions
    expected_behavior: Show blockers and residual risk, not only green status.
    target_epics: [EPIC-151, EPIC-147]
  - fixture_case_id: K12-T8
    situation: Safety briefing for contractor missing before work
    expected_behavior: Block work release or generate escalation work.
    target_epics: [EPIC-143, EPIC-144, EPIC-147]
  - fixture_case_id: K12-T9
    situation: Fault recurs after handover
    expected_behavior: Allow defect reopen and systematic-fault classification.
    target_epics: [EPIC-142, EPIC-147]
  - fixture_case_id: K12-T10
    situation: Commercial settlement exists while technical effectiveness is open
    expected_behavior: Separate commercially settled from technically closed.
    target_epics: [EPIC-142, EPIC-151, EPIC-147]
risks:
  - risk_id: SME-RP-RISK-001
    risk: Compressed sign-off makes architecture look unconstrained.
    severity: high
    mitigation: Maintain approval-with-conditions annexes and traceability.
  - risk_id: SME-RP-RISK-002
    risk: Conditions are interpreted as freezing all platform work.
    severity: medium
    mitigation: Apply module-specific readiness gates.
  - risk_id: SME-RP-RISK-003
    risk: Scope levels are omitted and create false closure.
    severity: high
    mitigation: Add capex_scope and fixture scope tests.
  - risk_id: SME-RP-RISK-004
    risk: Commercial workflow becomes an ERP clone.
    severity: medium
    mitigation: Constrain commercial status as observation and reconciliation.
  - risk_id: SME-RP-RISK-005
    risk: Safety readiness is treated as fixture-specific.
    severity: high
    mitigation: Add safety and work-permit readiness as a standard CAPEX workflow.
workflow_classification:
  - workflow: Scope Management
    classification: MVP / early
  - workflow: Budget and Commercial Control
    classification: MVP / early
  - workflow: Safety and Work Permit Readiness
    classification: MVP / early
  - workflow: Commissioning / Start-up
    classification: MVP / early
  - workflow: Production Release
    classification: MVP / early
  - workflow: Maintenance Handover
    classification: MVP / early
  - workflow: Shutdown / Schedule Planning
    classification: MVP-lite / conditional
  - workflow: Supplier Claim / Warranty
    classification: Post-MVP reserved
  - workflow: Lessons Learned / After-Handover Performance
    classification: Post-MVP reserved
