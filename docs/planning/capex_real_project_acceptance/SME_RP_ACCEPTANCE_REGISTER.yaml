schema_version: capex.sme_rp_acceptance_register.v1
namespace: SME-RP
title: CAPEX subject-matter / real-project acceptance conditions
activation_posture: planning_only_no_capex_activation
source_provenance:
  source_archive_basename: CAPEX_Codex_Planning_With_SME_K12_Conditions_Update_v1.zip
  source_namespace: SME-K12
  repo_namespace: SME-RP
  source_task_range: TASK-0625..TASK-0641
  repo_task_range: TASK-0648..TASK-0664
  note: K12 remains the first binding fixture slice; SME-RP is the generalized repo namespace.
approval_posture:
  gate_id: SME-RP-G001
  approval_kind: approval_with_conditions
  wording_ref: docs/planning/capex_real_project_acceptance/SME_RP_APPROVAL_WITH_CONDITIONS_SIGN_OFF.md
  conditional: true
  module_specific: true
  non_activation: true
  blocking_scope: affected_module_only
  affected_module_only: true
  cannot_be_used_for:
    - implementation_approval
    - capex_runtime_activation
    - product_activation
    - public_route_activation
    - migration_approval
    - raw_corpus_import
raci_role_permission_matrix:
  gate_id: SME-RP-G002
  contract_ref: docs/architecture/CAPEX_RACI_ROLE_PERMISSION_MATRIX.md
  authority_boundary: business_responsibility_overlay_not_authorization_source
  roles:
    - Project Manager
    - Engineering SME
    - Maintenance
    - Production / Operator
    - EHS
    - Procurement
    - Controlling
    - Plant Management
    - Technical Director
    - CEO / Sponsor
    - Supplier
  governed_actions:
    - create_source_occurrence
    - review_evidence_link
    - approve_decision_package
    - adopt_project_state
    - close_closure_dimension
    - reopen_closure_dimension
    - waive_evidence_or_residual_risk
    - escalate_to_ceo_sponsor
  minimum_project_role_posture:
    create_source_occurrence: project_contributor
    review_evidence_link: project_contributor_plus_review_assignment
    approve_decision_package: project_admin_or_canonical_approval_responder
    adopt_project_state: project_admin_plus_canonical_approval_evidence
    close_closure_dimension: project_admin_plus_closure_evidence
    reopen_closure_dimension: project_contributor_plus_stale_reopen_basis
    waive_evidence_or_residual_risk: project_admin_plus_waiver_evidence
    escalate_to_ceo_sponsor: project_contributor_plus_escalation_basis
  permission_sources:
    - project_memberships
    - capex_project_authorization
    - canonical_approvals
    - audited_events
    - immutable_artifacts
    - promotion_pointers
  never_permission_sources:
    - generated_material
    - workpage_state
    - ai_output
    - external_status
    - local_folder_state
    - file_presence
    - pr_po_invoice_state
    - supplier_statement
    - handover_note
module_specific_readiness_rule:
  rule_id: SME-RP-MODULE-READINESS-RULE.v1
  gate_refs: [SME-RP-G002, SME-RP-G012]
  blocking_scope: affected_module_only
  unresolved_business_definitions_block: dependent_modules_and_surfaces_only
  affected_surface_types:
    - workflow
    - workpage_family
    - projection_family
    - snapshot_export_surface
    - external_observation_surface
  independent_work_may_continue:
    - platform_hardening
    - schema_parity
    - security_fixes
    - neutral_foundation_work
    - disabled_capex_scaffolding
  readiness_requires:
    - required_business_definitions_accepted_or_explicitly_waived
    - raci_role_permission_posture_resolved_for_governed_actions
    - workflow_extension_classification_resolved
    - activation_gate_evidence_recorded_for_affected_module
  cannot_be_used_for:
    - implementation_approval
    - capex_runtime_activation
    - product_activation
    - public_route_activation
    - migration_approval
    - raw_corpus_import
evidence_status_vocabulary:
  gate_id: SME-RP-G004
  contract_ref: docs/architecture/CAPEX_EVIDENCE_STATUS_TRANSITION_CONTRACT.md
  principle: presence_is_not_sufficiency
  statuses:
    - proposed
    - under_review
    - valid
    - partly_valid
    - contradictory
    - obsolete
    - invalid
    - insufficient
    - accepted_with_residual_risk
  closure_eligibility:
    valid: may_satisfy_closure
    accepted_with_residual_risk: requires_explicit_residual_risk_acceptance_or_waiver
    proposed: cannot_satisfy_closure
    under_review: cannot_satisfy_closure
    partly_valid: cannot_satisfy_closure
    contradictory: cannot_satisfy_closure
    obsolete: cannot_satisfy_closure
    invalid: cannot_satisfy_closure
    insufficient: cannot_satisfy_closure
  transitions:
    proposed: [under_review, invalid, obsolete]
    under_review: [valid, partly_valid, contradictory, obsolete, invalid, insufficient]
    valid: [under_review, contradictory, obsolete]
    partly_valid: [under_review, accepted_with_residual_risk, contradictory, obsolete, invalid, insufficient]
    accepted_with_residual_risk: [under_review, contradictory, obsolete]
    contradictory: [under_review, obsolete]
    invalid: [under_review, obsolete]
    insufficient: [under_review, invalid, obsolete]
    obsolete: [under_review]
  transition_notes:
    obsolete_to_under_review: requires_new_source_occurrence_or_revision_reopen
  never_sufficient_alone:
    - raw_file_presence
    - extracted_text
    - ai_output
    - workpage_state
    - external_status
    - local_folder_state
    - pr_po_invoice_state
    - handover_note
    - supplier_statement
    - generated_artifact
source_occurrence_context_profile:
  gate_id: SME-RP-G004
  contract_ref: docs/architecture/CAPEX_SOURCE_OCCURRENCE_CONTEXT_AND_TRUST_CONTRACT.md
  source_truth_boundary: observed_source_truth_not_reviewed_project_truth
  required_context_fields:
    - source_occurrence_id
    - tenant_id
    - domain
    - project_id
    - capex_scope_ref
    - source_ref
    - original_source_role
    - package_workstream_ref
    - source_state_hint
    - extraction_state
    - redaction_state
    - source_origin_mode
    - evidence_source_trust_mode
    - observed_at
    - custody_ref
  source_origin_modes:
    - primary
    - derivative
    - generated
    - external
    - imported
  evidence_source_trust_modes:
    - observed
    - referenced
    - imported
    - reviewed
    - officially_adopted
  separation_rules:
    - source_occurrence_is_observed_source_truth
    - source_ref_points_to_meaningful_source_occurrence
    - evidence_binding_links_claim_to_reviewed_source_context
    - review_records_evidence_status
    - approval_records_governed_decision
    - official_adoption_requires_canonical_artifact_event_pointer_evidence
  cannot_overwrite_capex_state:
    - raw_file
    - external_status
    - imported_status
    - generated_artifact
    - ai_output
    - workpage_state
    - local_folder_state
    - pr_po_invoice_state
    - supplier_statement
    - handover_note
  later_scope_gate_refs:
    - SME-RP-G011
workpage_task_generation_rules:
  gate_id: SME-RP-G005
  contract_ref: docs/architecture/CAPEX_WORKPAGE_TO_TASK_GENERATION_CONTRACT.md
  authority_boundary: workpages_never_set_official_project_status
  blocker_types:
    - missing_evidence
    - missing_responsibility
    - revision_required
    - commercial_cost_gap
    - safety_readiness_gap
    - contradictory_evidence
  allowed_canonical_outputs:
    - task
    - flag
    - approval
    - artifact_delta
    - event
    - pointer_request
  required_guards:
    - stale_basis_check
    - source_binding
    - actor_authority
    - audit_evidence
  cannot_set_by_workpage_projection:
    - official_project_status
    - closure
    - evidence_sufficiency
    - commercial_status
    - safety_readiness
  disallowed_command_families:
    - generic_status_command
  required_rejection_conditions:
    - invalid_signature
    - expired_cursor
    - stale_projection_snapshot
    - superseded_projection_snapshot
    - basis_hash_mismatch
    - unresolved_source_ref
    - missing_actor_authority
    - missing_audit_evidence
acceptance_gates:
  - gate_id: SME-RP-G001
    gate_name: Approval-with-conditions and signature limitation recorded
    target_epics: [EPIC-136]
    source_conditions: [TOP-01, 1-A1, 1-A2, 15-A1, 15-A3]
    blocking_reason: SME approval cannot be reused as unconditional implementation approval.
  - gate_id: SME-RP-G002
    gate_name: Status model and RACI annex approved before affected modules
    target_epics: [EPIC-136, EPIC-140]
    source_conditions: [2-A1, 5-A3, 14-D8, 15-A2]
    blocking_reason: Role-sensitive workflow activation requires accepted RACI.
  - gate_id: SME-RP-G003
    gate_name: capex_scope and hierarchy contract approved
    target_epics: [EPIC-140, EPIC-143]
    source_conditions: [TOP-02, TOP-03, 5-A1, 5-A2, 8-A1]
    blocking_reason: Scope-level fixture cases cannot pass without an explicit scope contract.
  - gate_id: SME-RP-G004
    gate_name: Evidence status vocabulary and occurrence context profile approved
    target_epics: [EPIC-141, EPIC-142]
    source_conditions: [6-A1, 6-A2, 6-A3]
    blocking_reason: Evidence/status workpages require frozen vocabulary and source context rules.
  - gate_id: SME-RP-G005
    gate_name: Workpage task-generation rules approved
    target_epics: [EPIC-144]
    source_conditions: [7-A2, 7-A3]
    blocking_reason: Workpages must create canonical tasks for blockers and must not set official status.
  - gate_id: SME-RP-G006
    gate_name: Budget and commercial workflow fields approved
    target_epics: [EPIC-143, EPIC-151]
    source_conditions: [TOP-04, 8-A2, 9-A2]
    blocking_reason: Commercial-control workflow cannot activate until mandatory fields are defined.
  - gate_id: SME-RP-G007
    gate_name: Executive escalation thresholds approved
    target_epics: [EPIC-151]
    source_conditions: [TOP-11, 9-A3, 14-D3]
    blocking_reason: Escalation tasks cannot activate until threshold families are signed off.
  - gate_id: SME-RP-G008
    gate_name: Partial handover and observation-phase statuses approved
    target_epics: [EPIC-142]
    source_conditions: [TOP-06, TOP-07, 10-A2, 10-A3, 10-A4, 14-D4, 14-D5]
    blocking_reason: Closure, handover, and effectiveness workflows require frozen statuses.
  - gate_id: SME-RP-G009
    gate_name: AI trust status and source-binding rules approved
    target_epics: [EPIC-142, EPIC-147]
    source_conditions: [TOP-09, 11-A2, 11-A3, 11-A4]
    blocking_reason: AI output cannot appear in executive/status views without explicit trust and source labels.
  - gate_id: SME-RP-G010
    gate_name: K12 fixture cases accepted as first binding real-project catalogue
    target_epics: [EPIC-146, EPIC-147]
    source_conditions: [TOP-12, 12-A1]
    blocking_reason: MVP subject-matter acceptance requires the first binding real-project stress tests.
  - gate_id: SME-RP-G011
    gate_name: External data-source mode taxonomy approved
    target_epics: [EPIC-151]
    source_conditions: [13-A3, 14-D9]
    blocking_reason: External observation work requires signed external-mode semantics.
  - gate_id: SME-RP-G012
    gate_name: Workflow extension MVP classification approved
    target_epics: [EPIC-143]
    source_conditions: [8-A1, 8-A2, 8-A3, 8-A4, 8-A5, 8-A6, 8-A7, 8-A8, 14-D1]
    blocking_reason: Classification prevents silent MVP scope creep while preserving required workflow families.
  - gate_id: SME-RP-G013
    gate_name: Subject-matter boundary negative tests include first fixture additions
    target_epics: [EPIC-149]
    source_conditions: [4-A2, 4-A3, 13-A1, 14-D6]
    blocking_reason: No false status from PR/PO, supplier done, work performed, scope closed, defect closed, controlling, minutes, or settlement.
