purpose: External architecture pattern library (LLM-friendly, reference-only). Read
  cards first; open sources only when needed.
usage:
- In task briefs, reference pattern IDs under `patterns`.
- 'Default: only open the card(s). Only open `sources/converted/*` when the task touches
  the affected subsystem.'
- Pattern cards do not override authoritative workflow, schema, or architecture documents.
- If you use a pattern to justify a design choice, record it in an ADR and link the
  pattern ID.
