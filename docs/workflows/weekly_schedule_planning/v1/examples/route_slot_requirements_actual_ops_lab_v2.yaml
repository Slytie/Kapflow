planner_notes:
- Route counts for 2026-03-22..2026-03-28 come only from Schedule March 22 to March 28.pdf.
- Staffing cells, staffing patterns, and richer route mix data from that holdout schedule are
  intentionally excluded from this lab-normalized package.
- The deterministic planner should cover required routes first, then fill up to four explicit
  On-Call buffer positions per day if legal driver-days remain.
- All routes are temporarily modeled as homogeneous cycle1_standard parcel-delivery
  XL-van slots until richer route mix data arrives.
- This payload carries explicit Sunday-start operational scope even though the repo
  PlanningWeekID remains ISO-based.
