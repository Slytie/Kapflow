profile:
  workflow_id: dispatch_reporting.v1
  version: 1
  stages:
  - stage_id: Stage01
    execution_pattern: linear_chain
    allowed_tool_classes:
    - artifact.read
    - validation
    - spreadsheet.transform
    side_effect_policy: draft_only
    required_evidence_keys:
    - reporting.eos_raw.workbook
    decision_refs: []
    stop_rules:
      max_tool_calls: 10
      no_progress_ticks: 2
      on_exhaustion: escalate
    projections:
    - reporting.stage01.intake_packet
    extensions:
      guidance:
      - Preserve both the raw workbook and a row-level normalized representation.
  - stage_id: Stage02
    execution_pattern: linear_chain
    allowed_tool_classes:
    - artifact.read
    - validation
    - spreadsheet.transform
    - flag.raise
    side_effect_policy: draft_only
    required_evidence_keys:
    - reporting.actuals_normalized.workbook
    decision_refs: []
    stop_rules:
      max_tool_calls: 16
      no_progress_ticks: 3
      on_exhaustion: escalate
    projections:
    - reporting.stage02.normalization_packet
    extensions:
      guidance:
      - Recompute summary metrics from route rows. Broken formulas must not silently
        pass through as truth.
  - stage_id: Stage03
    execution_pattern: linear_chain
    allowed_tool_classes:
    - artifact.read
    - validation
    - spreadsheet.transform
    - flag.raise
    - projection.render
    side_effect_policy: draft_only
    required_evidence_keys:
    - reporting.upd_draft.workbook
    decision_refs: []
    stop_rules:
      max_tool_calls: 18
      no_progress_ticks: 3
      on_exhaustion: escalate
    projections:
    - reporting.stage03.draft_packet
    extensions:
      guidance:
      - Keep UPD / >600-minute logic separate from WHC scheduling logic.
      - The workbook draft is the canonical review surface for the first operator lane.
  - stage_id: Stage04
    execution_pattern: approval_gate
    allowed_tool_classes:
    - artifact.read
    - approval.request
    - projection.render
    side_effect_policy: commit_requires_business_decision
    required_evidence_keys:
    - reporting.manager_review.doc
    - reporting.upd_draft.workbook
    decision_refs:
    - reporting.stage04.confirm_reporting_packet
    stop_rules:
      max_tool_calls: 8
      no_progress_ticks: 2
      on_exhaustion: wait_for_human
    projections:
    - reporting.stage04.review_packet
    extensions:
      guidance:
      - Approval records the review boundary for the workbook-backed packet and triggers the bounded finalize path on approve.
  - stage_id: Stage05
    execution_pattern: linear_chain
    allowed_tool_classes:
    - artifact.read
    - artifact.publish_version
    - projection.render
    side_effect_policy: draft_only
    required_evidence_keys:
    - reporting.final_packet.workbook
    decision_refs: []
    stop_rules:
      max_tool_calls: 10
      no_progress_ticks: 2
      on_exhaustion: escalate
    projections:
    - reporting.stage05.final_packet
    extensions:
      guidance:
      - The final packet must link to the normalized rows, not only to the fragile original formulas.
      - The first operator lane emits the finalized workbook plus the notify-only planning feedback handoff, not a separate rendered document packet.
