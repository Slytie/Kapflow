registry:
  id: logistics_method_packages.v1
  version: 1
  packages:
    - id: method.weekly_schedule_planning.stage01.route_horizon.v1
      version: 1
      applies_to:
        workflow_id: weekly_schedule_planning.v1
        stage_id: Stage01
      execution_pattern: linear_chain
      context_builder_ref: context.weekly_schedule_planning.stage01.route_horizon.v1
      tool_profile_ref: tools.weekly_schedule_planning.stage01.v1
      output_schema_ref: schema.weekly_schedule_planning.stage01.route_packet.v1
      lowering_rule_ref: lowering.weekly_schedule_planning.stage01.route_packet.v1
      stop_policy:
        max_tool_calls: 12
        no_progress_ticks: 3
        on_exhaustion: escalate
      replay_policy:
        deterministic_fields:
          - tenant_id
          - domain_id
          - planning_week_id
          - route_horizon_row_id
        allow_optional_llm_rationale: false
      notes:
        - Deterministic normalization of horizon route rows for weekly planning intake.

