# ARTIFACT_MAP.yaml — Payroll v1 artifact map (from template pack)

# This file enumerates dataset_keys and labels them.
# - official_input: inputs to computations/workflow progression
# - official_output: outputs published as official artifacts
# - evidence: supporting docs; still immutable/versioned but not used as computation input

artifact_sets:
  Stage01:
    - key: payroll.config.doc
      role: official_input
      template_source: Stage01_Payroll_Config/Stage01_Payroll_Config_Document_Template_EMPTY.docx
    - key: payroll.config.workbook
      role: official_input
      template_source: Stage01_Payroll_Config/Stage01_Payroll_Config_Spreadsheet_Template_EMPTY.xlsx

  Stage02:
